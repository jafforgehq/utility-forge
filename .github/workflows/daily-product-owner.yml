name: Daily Product Owner Idea

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: daily-product-owner-idea
  cancel-in-progress: false

jobs:
  create-daily-idea:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate idea and open issue
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          OPENAI_DAILY_CALL_LIMIT: ${{ vars.OPENAI_DAILY_CALL_LIMIT || secrets.OPENAI_DAILY_CALL_LIMIT || '1' }}
          TOOL_LAUNCH_OFFSET_DAYS: ${{ vars.TOOL_LAUNCH_OFFSET_DAYS || secrets.TOOL_LAUNCH_OFFSET_DAYS || '1' }}
        with:
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const avaName = "Ava PO";
            const avaAvatar = "https://api.dicebear.com/9.x/bottts-neutral/svg?seed=AvaPO";
            const now = new Date();
            const dateTag = now.toISOString().slice(0, 10);
            const aiCallLimit = Number(process.env.OPENAI_DAILY_CALL_LIMIT || "1");
            const launchOffsetDays = Math.max(1, Number(process.env.TOOL_LAUNCH_OFFSET_DAYS || "1"));
            const launchDateObj = new Date(now);
            launchDateObj.setUTCDate(launchDateObj.getUTCDate() + launchOffsetDays);
            const launchDate = launchDateObj.toISOString().slice(0, 10);

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description
                });
              }
            }

            await ensureLabel("role:product-owner", "005f73", "Issue created by Product Owner");
            await ensureLabel("status:ready-for-engineering", "0a9396", "Ready for Software Engineer");
            await ensureLabel("type:tool", "94d2bd", "Developer tool request");

            const recent = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "all",
              labels: "role:product-owner",
              per_page: 100
            });

            if (recent.data.some((issue) => String(issue.created_at || "").startsWith(dateTag))) {
              core.info(`Daily Product Owner issue already exists for ${dateTag}.`);
              return;
            }

            const extractToolName = (body, fallbackTitle = "") => {
              const match = String(body || "").match(/## Tool\s*([\s\S]*?)(\n## |\n---|$)/i);
              if (!match || !match[1]) return fallbackTitle;
              const line = match[1]
                .split("\n")
                .map((row) => row.trim())
                .find(Boolean);
              return line || fallbackTitle;
            };

            const normalize = (text) =>
              String(text || "")
                .toLowerCase()
                .replace(/\[[^\]]+\]/g, "")
                .replace(/[^a-z0-9\s]/g, " ")
                .replace(/\s+/g, " ")
                .trim();

            const existingToolNames = new Set(
              recent.data.map((issue) =>
                normalize(extractToolName(issue.body, issue.title.replace(/^\[[^\]]+\]\s*/, "")))
              )
            );

            const seeds = fs.readFileSync("data/idea-seeds.md", "utf8");
            const seedLines = seeds
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => line.startsWith("- "))
              .map((line) => line.slice(2));

            const fallbackSeed =
              seedLines.find((seed) => !existingToolNames.has(normalize(seed))) ||
              `Semver comparison utility ${dateTag}`;
            const fixedThemes = [
              "API and payload workflows",
              "Auth, security, and encoding helpers",
              "CLI and shell productivity",
              "Frontend debugging and DX",
              "Data formatting and transformation",
              "DevOps and CI diagnostics",
              "Docs and release workflow helpers"
            ];
            const themeIndex = now.getUTCDay() % fixedThemes.length;
            const themeOfDay = fixedThemes[themeIndex];

            let brief = "";
            let toolName = "";
            let selectionNotes = "";

            const ensurePoScorecard = (text, selectedToolName) => {
              if (/##\s*PO Scorecard/i.test(String(text || ""))) {
                return text;
              }

              const scorecard = [
                "## PO Scorecard",
                "- Value: 4/5",
                "- Effort: S",
                "- Confidence: 0.78",
                `- Why now: Developers are repeatedly asking for quick ${selectedToolName} workflows in day-to-day delivery.`
              ].join("\n");

              return `${String(text || "").trim()}\n\n${scorecard}`.trim();
            };

            const extractSection = (text, sectionName) => {
              const regex = new RegExp(`##\\s*${sectionName}\\s*([\\s\\S]*?)(\\n## |\\n---|$)`, "i");
              const match = String(text || "").match(regex);
              return match?.[1]?.trim() || "";
            };

            const extractScorecardField = (scorecardText, fieldName, fallback = "") => {
              const regex = new RegExp(`-\\s*${fieldName}\\s*:\\s*(.+)`, "i");
              const match = String(scorecardText || "").match(regex);
              return match?.[1]?.trim() || fallback;
            };

            const parseValue = (raw) => {
              const match = String(raw || "").match(/(\d+(?:\.\d+)?)/);
              return match ? Number(match[1]) : 3;
            };

            const parseConfidence = (raw) => {
              const text = String(raw || "").trim();
              if (!text) return 0.7;
              const percent = text.match(/(\d+(?:\.\d+)?)\s*%/);
              if (percent) return Math.max(0, Math.min(1, Number(percent[1]) / 100));
              const numeric = text.match(/(\d+(?:\.\d+)?)/);
              if (!numeric) return 0.7;
              const value = Number(numeric[1]);
              return value > 1 ? Math.max(0, Math.min(1, value / 100)) : Math.max(0, Math.min(1, value));
            };

            const effortPenalty = (raw) => {
              const value = String(raw || "").toUpperCase();
              if (value.includes("XS")) return 0;
              if (value.includes("S")) return 0.15;
              if (value.includes("M")) return 0.45;
              if (value.includes("XL")) return 1.1;
              if (value.includes("L")) return 0.8;
              return 0.5;
            };

            const noveltyPenalty = (name) => {
              const normalizedName = normalize(name);
              if (!normalizedName) return 0.8;
              if (existingToolNames.has(normalizedName)) return 2;
              let overlapHits = 0;
              for (const existing of existingToolNames) {
                if (!existing) continue;
                const tokens = new Set(normalizedName.split(" "));
                const existingTokens = new Set(existing.split(" "));
                let overlap = 0;
                for (const token of tokens) {
                  if (existingTokens.has(token) && token.length > 3) overlap += 1;
                }
                if (overlap >= 2) overlapHits += 1;
              }
              return overlapHits ? Math.min(1.2, overlapHits * 0.2) : 0;
            };

            const scoreCandidate = (candidateName, candidateBrief) => {
              const scorecard = extractSection(candidateBrief, "PO Scorecard");
              const value = parseValue(extractScorecardField(scorecard, "Value", "4"));
              const confidence = parseConfidence(extractScorecardField(scorecard, "Confidence", "0.72"));
              const effort = extractScorecardField(scorecard, "Effort", "M");
              const score =
                value +
                confidence * 2 -
                effortPenalty(effort) -
                noveltyPenalty(candidateName);
              return Number(score.toFixed(2));
            };

            const allRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              per_page: 100
            });
            const aiCallsToday = allRuns.data.workflow_runs.filter(
              (run) =>
                run.path === ".github/workflows/daily-product-owner.yml" &&
                run.created_at.startsWith(dateTag) &&
                Number(run.id) !== Number(context.runId)
            ).length;

            const canUseAI =
              Boolean(process.env.OPENAI_API_KEY) &&
              Number.isFinite(aiCallLimit) &&
              aiCallLimit > 0 &&
              aiCallsToday < aiCallLimit;

            const generateIdea = async (extraInstruction = "") => {
              const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: process.env.OPENAI_MODEL || "gpt-4o-mini",
                  temperature: 0.6,
                  max_tokens: 700,
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are a Product Owner creating exactly one practical micro-tool idea for developers."
                    },
                    {
                      role: "user",
                      content: [
                        "Create one new daily tool idea for Utility Forge.",
                        "The idea must align with the current fixed theme of the day.",
                        "Return markdown with sections:",
                        "## Tool",
                        "## Problem",
                        "## Users",
                        "## MVP Scope",
                        "## PO Scorecard (Value, Effort, Confidence, Why now)",
                        "## Acceptance Criteria (3-5 bullet points)",
                        "",
                        `Seed direction: ${fallbackSeed}`,
                        `Theme of the day: ${themeOfDay}`,
                        `Avoid duplicate tool names or near matches: ${Array.from(existingToolNames).join("; ")}`,
                        "Avoid generic titles like 'Daily Tool Idea'. Use a concrete descriptive tool name.",
                        extraInstruction
                      ]
                        .filter(Boolean)
                        .join("\n")
                    }
                  ]
                })
              });

              if (!response.ok) {
                throw new Error(`OpenAI call failed (${response.status})`);
              }

              const payload = await response.json();
              const content = payload.choices?.[0]?.message?.content?.trim() || "";
              return content;
            };

            if (canUseAI) {
              try {
                const candidates = [];
                const attemptedNames = new Set();
                for (let i = 0; i < 3; i += 1) {
                  const extra = i
                    ? `Candidate ${i + 1}: must be clearly different from previous names: ${Array.from(attemptedNames).join("; ")}`
                    : "Candidate 1: provide the strongest, practical idea.";
                  const candidateBriefRaw = await generateIdea(extra);
                  const candidateName = String(extractToolName(candidateBriefRaw, ""))
                    .replace(/^[*-]\s*/, "")
                    .replace(/[`*_#]/g, "")
                    .trim();
                  const candidateBrief = ensurePoScorecard(candidateBriefRaw, candidateName || fallbackSeed);
                  if (candidateName) {
                    attemptedNames.add(candidateName);
                  }
                  candidates.push({
                    brief: candidateBrief,
                    name: candidateName || fallbackSeed
                  });
                }

                const scored = candidates
                  .map((item, index) => ({
                    ...item,
                    rank: index + 1,
                    score: scoreCandidate(item.name, item.brief)
                  }))
                  .sort((a, b) => b.score - a.score);

                const winner =
                  scored.find((item) => !existingToolNames.has(normalize(item.name))) || scored[0];
                brief = winner.brief;
                toolName = winner.name;

                selectionNotes = [
                  "## Idea Selection Notes",
                  `- Theme of the day: ${themeOfDay}`,
                  "- Ava PO reviewed 3 candidates and selected the top internal score.",
                  ...scored.map(
                    (item) =>
                      `- Candidate ${item.rank}: ${item.name} (score ${item.score.toFixed(2)})${
                        item.name === winner.name ? " <- selected" : ""
                      }`
                  )
                ].join("\n");
              } catch (error) {
                core.warning(`OpenAI generation failed: ${error.message}`);
              }
            } else if (process.env.OPENAI_API_KEY && aiCallsToday >= aiCallLimit) {
              core.warning(
                `OPENAI_DAILY_CALL_LIMIT reached (${aiCallsToday}/${aiCallLimit}). Using fallback idea.`
              );
            } else {
              core.warning("OPENAI_API_KEY is not set. Using deterministic fallback idea.");
            }

            if (!brief || !toolName || existingToolNames.has(normalize(toolName))) {
              brief = [
                "## Tool",
                fallbackSeed,
                "",
                "## Problem",
                "Developers waste time searching for tiny one-off conversions and lookups.",
                "",
                "## Users",
                "Frontend and backend engineers shipping quickly.",
                "",
                "## MVP Scope",
                "- Single-page utility",
                "- Instant client-side result",
                "- Copy-to-clipboard support",
                "",
                "## PO Scorecard",
                "- Value: 4/5",
                "- Effort: S",
                "- Confidence: 0.78",
                `- Why now: Developers need this ${fallbackSeed} workflow repeatedly while shipping quickly.`,
                "",
                "## Acceptance Criteria",
                "- Input validation with useful errors",
                "- Mobile + desktop layout works",
                "- Core logic has automated tests",
                "- README updated with usage"
              ].join("\n");
              toolName = fallbackSeed;
              selectionNotes = [
                "## Idea Selection Notes",
                `- Theme of the day: ${themeOfDay}`,
                "- OpenAI path was not available, so deterministic fallback was selected."
              ].join("\n");
            }

            const cleanToolName = (value) =>
              String(value || "")
                .replace(/^[*-]\s*/, "")
                .replace(/[`*_#]/g, "")
                .trim();

            const finalToolName = cleanToolName(toolName || fallbackSeed) || fallbackSeed;
            const issueTitle = `[Product Owner] ${finalToolName} (Launch ${launchDate})`;

            const body = [
              "Daily idea generated by **Product Owner automation**.",
              "",
              `Prepared by **${avaName}**.`,
              "",
              brief,
              "",
              selectionNotes,
              "",
              "## Launch Date",
              launchDate,
              "",
              "---",
              "### Handoff",
              "- Software Engineer: implement this tool in `site/` and add tests in `test/`.",
              "- QA: validate against acceptance criteria and approve merge."
            ].join("\n");

            const createdIssue = await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body,
              labels: ["role:product-owner", "status:ready-for-engineering", "type:tool"]
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: createdIssue.data.number,
              body: [
                `![${avaName}](${avaAvatar})`,
                `### ${avaName} Daily Standup (${dateTag})`,
                "",
                "**Yesterday**",
                "- Reviewed recent tool outcomes and filtered duplicate ideas.",
                "",
                "**Today**",
                `- Created and prioritized **${finalToolName}** for implementation.`,
                "- Triggered engineering handoff with launch date alignment.",
                "",
                "**Blockers**",
                "- None right now.",
                "",
                `_${avaName} (Product Owner)_`
              ].join("\n")
            });

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "software-engineer.yml",
              ref: "main",
              inputs: {
                issue_number: String(createdIssue.data.number)
              }
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: createdIssue.data.number,
              body: [
                `### ${avaName} Handoff`,
                "- Software Engineer automation dispatched.",
                "- QA will receive the PR handoff automatically after implementation.",
                "",
                `_${avaName} (Product Owner)_`
              ].join("\n")
            });
